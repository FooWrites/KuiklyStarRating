name: maven-local

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  publish-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Publish libraries to Maven Local
        run: ./gradlew :starrating:publishToMavenLocal :starrating-compose:publishToMavenLocal --no-daemon --stacktrace
      - name: Assemble Android host
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
